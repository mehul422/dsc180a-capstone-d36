apiVersion: v1
kind: Pod
metadata:
  name: cs-cutlass
spec:
  nodeSelector:
    kubernetes.io/hostname: sdsmt.gp-argo.greatplains.net
  containers:
  - name: bench
    image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: "4"
        memory: 32Gi
        nvidia.com/a100: 1
      limits:
        cpu: "4"
        memory: 32Gi
        nvidia.com/a100: 1
  restartPolicy: Never
