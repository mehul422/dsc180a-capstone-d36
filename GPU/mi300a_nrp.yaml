apiVersion: v1
kind: Pod
metadata:
  name: mi300a-benchmark-pod
  labels:
    app: capstone-benchmark
spec:
  containers:
  - name: rocm-container
    image: rocm/pytorch:latest
    command: ["sleep", "infinity"]
    resources:
      limits:
        amd.com/gpu: 1
        memory: "128Gi"
        cpu: "16"
      requests:
        amd.com/gpu: 1
        memory: "64Gi"
        cpu: "8"
  restartPolicy: Never
